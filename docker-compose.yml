services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slidegen
      POSTGRES_PASSWORD: slidegen
      POSTGRES_DB: slidegen
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidegen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
